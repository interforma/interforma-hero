<!--
  Interforma — Firma de correo corporativo
  Dirección: hola@interforma.digital
  Optimizada para Gmail, Apple Mail y Outlook.
  Todas las propiedades CSS son inline para máxima compatibilidad.
  No requiere imágenes externas ni dependencias.
-->
<table
  width="100%"
  cellpadding="0"
  cellspacing="0"
  border="0"
  role="presentation"
  style="max-width:440px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color:#111110; line-height:1;"
>
  <tr>
    <td style="padding:0; vertical-align:top;">

      <!-- Marca: icono + wordmark -->
      <table cellpadding="0" cellspacing="0" border="0" role="presentation">
        <tr>
          <td
            width="22"
            height="22"
            style="
              width:22px;
              height:22px;
              background:#2655E8;
              border-radius:5px;
              text-align:center;
              vertical-align:middle;
              font-size:13px;
              font-weight:700;
              color:#ffffff;
              font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
              line-height:22px;
              padding:0;
              mso-line-height-rule:exactly;
            "
          >i</td>
          <td style="padding-left:7px; vertical-align:middle;">
            <span
              style="
                font-size:15px;
                font-weight:700;
                color:#111110;
                letter-spacing:-0.3px;
                font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
              "
            >interforma</span>
          </td>
        </tr>
      </table>

      <!-- Tagline -->
      <p
        style="
          margin:7px 0 0 0;
          padding:0;
          font-size:11.5px;
          color:#737370;
          line-height:1.45;
          font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        "
      >Ideas que conectan. Sistemas que funcionan.</p>

      <!-- Separador -->
      <table
        width="100%"
        cellpadding="0"
        cellspacing="0"
        border="0"
        role="presentation"
        style="margin:13px 0 12px 0;"
      >
        <tr>
          <td
            style="
              border-top:1px solid #E8E8E5;
              height:0;
              line-height:0;
              font-size:0;
              padding:0;
            "
          >&nbsp;</td>
        </tr>
      </table>

      <!-- Nombre y empresa -->
      <p
        style="
          margin:0;
          padding:0;
          font-size:13px;
          font-weight:600;
          color:#111110;
          line-height:1.4;
          font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        "
      >Sergio Valenzuela</p>
      <p
        style="
          margin:2px 0 0 0;
          padding:0;
          font-size:12px;
          color:#737370;
          line-height:1.4;
          font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        "
      >Interforma</p>

      <!-- Contacto -->
      <p style="margin:10px 0 0 0; padding:0; line-height:1;">
        <a
          href="mailto:hola@interforma.digital"
          style="
            font-size:12px;
            color:#2655E8;
            text-decoration:none;
            font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
          "
        >hola@interforma.digital</a>
      </p>
      <p style="margin:4px 0 0 0; padding:0; line-height:1;">
        <a
          href="https://interforma.digital"
          style="
            font-size:12px;
            color:#2655E8;
            text-decoration:none;
            font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
          "
        >interforma.digital</a>
      </p>

    </td>
  </tr>
</table>
