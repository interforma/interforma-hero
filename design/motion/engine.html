<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Outfit;src:url(fonts/outfit-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Manrope;src:url(fonts/manrope-latin-wght-normal.woff2) format('woff2');font-weight:200 800}
@font-face{font-family:JBM;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
html,body{margin:0;background:transparent}
#stage{display:block}
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
<!-- warm fonts -->
<div style="position:absolute;left:-9999px;font-family:Outfit;font-weight:500">a</div>
<div style="position:absolute;left:-9999px;font-family:Manrope">a</div>
<div style="position:absolute;left:-9999px;font-family:JBM">a</div>
<script>
const INK='#281F18', E='#EE6E43', BG='#E4E3DF', PAPEL='#F2F1EE', CIELO='#CCE2ED', MUTED='#5C534A', E800='#9A3D1A';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const ein=t=>t*t*t;
const eback=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const TAU=Math.PI*2;
function hex(c){return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16));}
function mix(a,b,t){const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('');}
// decaying wobble for "pop" moments
const wobble=(x,amp=.12,freq=3,decay=5)=>x<0?0:amp*Math.sin(x*TAU*freq)*Math.exp(-x*decay);

/* ---------- Punto, modelo de 200 u (círculo c=(100,108) r=72) ---------- */
function punto(s={}){
  const {ty=0,rot=0,sx=1,sy=1,eyes='oval',ex=0,ey=0,blink=1,eyeAlpha=1,
         flick=0,dots=null,conf=-1,sweat=-1,lines=0,fill=E}=s;
  const b=Math.max(.06,blink);
  let eye='';
  if(eyes==='oval') eye=`<ellipse cx="${82+ex}" cy="${100+ey}" rx="9" ry="${16*b}" fill="${INK}"/><ellipse cx="${118+ex}" cy="${100+ey}" rx="9" ry="${16*b}" fill="${INK}"/>`;
  if(eyes==='low')  eye=`<ellipse cx="${82+ex}" cy="${114+ey}" rx="8" ry="${12*b}" fill="${INK}"/><ellipse cx="${118+ex}" cy="${114+ey}" rx="8" ry="${12*b}" fill="${INK}"/>`;
  if(eyes==='round')eye=`<circle cx="${80+ex}" cy="${98+ey}" r="13" fill="${INK}"/><circle cx="${120+ex}" cy="${98+ey}" r="13" fill="${INK}"/>`;
  if(eyes==='happy')eye=`<path d="M${70+ex} ${102+ey}l12 -14l12 14M${106+ex} ${102+ey}l12 -14l12 14" stroke="${INK}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  if(eyes==='line') eye=`<path d="M${74+ex} ${104+ey}h16M${110+ex} ${104+ey}h16" stroke="${INK}" stroke-width="8" stroke-linecap="round" fill="none"/>`;
  const body=`<g transform="translate(0 ${ty}) rotate(${rot} 100 182) translate(100 182) scale(${sx} ${sy}) translate(-100 -182)">`+
    `<circle cx="100" cy="108" r="72" fill="${fill}"/><g opacity="${eyeAlpha}">${eye}</g></g>`;
  let x='';
  if(flick>0) x+=`<path d="M172 40l10 -10M178 58l14 -3M158 28l3 -13" stroke="${INK}" stroke-width="4" stroke-linecap="round" fill="none" opacity="${flick}"/>`;
  if(lines>0) x+=`<path d="M100 ${22+ty}v-12M70 ${28+ty}l-6 -10M130 ${28+ty}l6 -10" stroke="${INK}" stroke-width="4" stroke-linecap="round" fill="none" opacity="${lines}"/>`;
  if(dots){const P=[[160,40,5],[174,24,6.5],[189,9,8]];P.forEach((d,i)=>{if(dots[i]>0)x+=`<circle cx="${d[0]}" cy="${d[1]}" r="${d[2]}" fill="${INK}" opacity="${dots[i]}"/>`;});}
  if(conf>=0){
    const C=[[100,60,-70,-40,INK,'r'],[100,60,70,-50,E800,'r'],[100,60,-80,20,INK,'c'],[100,60,80,10,INK,'c'],[100,60,-40,-70,E800,'c'],[100,60,45,-75,INK,'r']];
    const k=eout(conf), a=conf<.7?1:1-(conf-.7)/.3;
    C.forEach(([x0,y0,vx,vy,col,sh],i)=>{const px=x0+vx*k, py=y0+vy*k+40*conf*conf; const rr=(i*60+conf*300);
      x+= sh==='r'?`<rect x="${px-5}" y="${py-5}" width="10" height="10" rx="2" fill="${col}" opacity="${a}" transform="rotate(${rr} ${px} ${py})"/>`:`<circle cx="${px}" cy="${py}" r="5" fill="${col}" opacity="${a}"/>`;});
  }
  if(sweat>=0){const dy=14*sweat, a=sweat<.75?1:1-(sweat-.75)/.25;
    x+=`<path d="M156 ${56+dy}q-9 14 0 20q9 -6 0 -20z" fill="${CIELO}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round" opacity="${a}"/>`;}
  return body+x;
}

/* ---------- Stickers (bucle 2 s, p ∈ [0,1)) ---------- */
const blinkAt=(p,c,w=.06)=>{const d=Math.abs(p-c);return d<w?d/w:1;};
const STICKERS={
  hola:p=>punto({rot:8*Math.sin(TAU*p*2),flick:.5+.5*Math.sin(TAU*p*4),blink:blinkAt(p,.82)}),
  piensa:p=>{const d=[0,1,2].map(i=>p>.85?1-(p-.85)/.15:clamp((p-.1-i*.15)/.1));return punto({ex:12,ey:-8,ty:-3*Math.sin(TAU*p),dots:d,blink:blinkAt(p,.6)});},
  celebra:p=>{const q=(p*2)%1;return punto({eyes:'happy',ty:-26*4*q*(1-q),sx:1+.06*Math.cos(TAU*q),sy:1-.06*Math.cos(TAU*q),conf:q});},
  sorpresa:p=>{const w=wobble(p*2,.14,2.2,4);return punto({eyes:'round',sx:1+w,sy:1-w,lines:p<.6?clamp(Math.sin(TAU*p*3)*.5+.5):clamp((1-p)/.4)*0});},
  uy:p=>punto({eyes:'low',rot:p<.35?2.5*Math.sin(TAU*p*8):0,sweat:p,blink:blinkAt(p,.7)}),
  ok:p=>{const n=Math.max(0,Math.sin(TAU*p*2));return punto({ty:7*n,sy:1-.04*n,sx:1+.03*n,ey:4*n,blink:1-.35*n});},
};
window.sticker=(name,p,size=512)=>{
  const svg=document.getElementById('stage');
  svg.setAttribute('width',size);svg.setAttribute('height',size);svg.setAttribute('viewBox','0 0 200 200');
  // margen de 16 px de WhatsApp: escala .9 centrada
  svg.innerHTML=`<g transform="translate(100 100) scale(.9) translate(-100 -100)">${STICKERS[name](p)}</g>`;
};

/* ---------- Reel 1080×1920, 15 s ---------- */
const W=1080,H=1920;
const M=150, SP=155;
const A=[385,1035],B=[540,880],C=[695,725];
const PC=[540,860], PR=300, F=PR/72;
function rrect(cx,cy,size,r,fill,op=1,rot=0){return `<rect x="${cx-size/2}" y="${cy-size/2}" width="${size}" height="${size}" rx="${r}" fill="${fill}" opacity="${op}" transform="rotate(${rot} ${cx} ${cy})"/>`;}
function text(str,x,y,{size=80,font='Outfit',weight=500,fill=INK,op=1,dy=0,ls=0}={}){
  if(op<=0) return '';
  const esc=str.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return `<text x="${x}" y="${y+dy}" text-anchor="middle" font-family="${font}" font-weight="${weight}" font-size="${size}" letter-spacing="${ls}" fill="${fill}" opacity="${op}">${esc}</text>`;
}
function fadeIO(t,a,b,c,d){return Math.min(eout(prog(t,a,b)),1-prog(t,c,d));}
function puntoAt(cx,cy,r,state){const f=r/72;return `<g transform="translate(${cx-100*f} ${cy-108*f}) scale(${f})">${punto(state)}</g>`;}

window.reel=(t)=>{
  const svg=document.getElementById('stage');
  svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let o=`<rect width="${W}" height="${H}" fill="${BG}"/>`;

  if(t<5.2){
    // 1 · El isotipo se arma; 2 · zoom al círculo
    const z=eio(prog(t,4.0,5.2)), s=lerp(1,PR/75,z);
    const tx=lerp(C[0],PC[0],z), ty=lerp(C[1],PC[1],z);
    const map=([x,y])=>[(x-C[0])*s+tx,(y-C[1])*s+ty];
    const ka=eout(prog(t,.3,.8));
    if(ka>0){const [x,y]=map(A);o+=rrect(x,y,M*s*lerp(.4,1,ka),15*s,INK,ka,lerp(-12,0,ka));}
    if(t>=.8){
      const kb=eio(prog(t,.8,1.5));const p=[lerp(A[0],B[0],kb),lerp(A[1],B[1],kb)];const [x,y]=map(p);
      o+=rrect(x,y,M*s,lerp(15,45,kb)*s,INK);
      const k=prog(t,.8,2.2);let q,r,col;
      if(k<.48){const u=ein(k/.48);q=[lerp(A[0],B[0],u),lerp(A[1],B[1],u)];r=lerp(15,45,u);col=INK;}
      else{const u=eout((k-.48)/.52);q=[lerp(B[0],C[0],u),lerp(B[1],C[1],u)];r=lerp(45,75,u);col=mix(INK,E,u);}
      const [cx,cy]=map(q);
      // pequeño "aterrizaje" del círculo
      const w=wobble(t-2.2,.06,2,6);
      o+=`<g transform="translate(${cx} ${cy}) scale(${1+w} ${1-w}) translate(${-cx} ${-cy})">${rrect(cx,cy,M*s,r*s,col)}</g>`;
    }
    const a1=fadeIO(t,2.6,3.1,3.8,4.2);
    o+=text('Toda transformación',540,1330,{size:76,op:a1,dy:20*(1-eout(prog(t,2.6,3.1)))});
    o+=text('tiene un resultado.',540,1420,{size:76,op:a1,dy:20*(1-eout(prog(t,2.7,3.2)))});
  }
  else if(t<11.6){
    // 3 · Punto despierta, saluda y recorre el Método
    let st={eyes:'oval'};
    st.blink=eout(prog(t,5.25,5.6));
    if(t>6.25&&t<6.45) st.blink=Math.abs(t-6.35)/.1;
    let cap='',sub='',capOp=0,subOp=0,eyebrowOp=0;
    if(t<8.0){
      const env=prog(t,5.8,6.0)*(1-prog(t,7.6,8.0));
      st.rot=7*Math.sin(TAU*(t-5.8)/.9)*env; st.flick=env*(.5+.5*Math.sin(TAU*(t-5.8)/.45));
      if(t>7.1&&t<7.3) st.blink=Math.abs(t-7.2)/.1;
      cap='Hola, soy Punto.'; capOp=fadeIO(t,6.0,6.4,7.65,7.95);
      sub='La cara de Interforma.'; subOp=fadeIO(t,6.2,6.6,7.65,7.95);
    } else {
      const beats=[['escucha','Entendemos.'],['piensa','Diseñamos.'],['trabaja','Implementamos.'],['celebra','Medimos.']];
      const i=Math.min(3,Math.floor((t-8.0)/.9)), bt=t-8.0-i*.9;
      const w=wobble(bt,.08,2.4,5);
      st.sx=1+w; st.sy=1-w;
      const [ex,label]=beats[i];
      if(ex==='escucha'){st.ex=-14;st.ey=4;}
      if(ex==='piensa'){st.ex=12;st.ey=-8;st.dots=[0,1,2].map(j=>clamp((bt-.1-j*.12)/.1));}
      if(ex==='trabaja'){st.eyes='line';}
      if(ex==='celebra'){st.eyes='happy';const q=clamp(bt/.7);st.ty=-30*4*q*(1-q);st.conf=clamp(bt/.9);}
      cap=label; capOp=Math.min(eout(clamp(bt/.18)), i<3?1-prog(bt,.78,.9):1);
      eyebrowOp=fadeIO(t,8.0,8.3,11.4,11.6);
      if(ex==='trabaja'){
        const k1=eback(clamp(bt/.35)), k2=eback(clamp((bt-.12)/.35));
        // dos módulos arman la escalera que sube hasta Punto (la composición del logo)
        o+=rrect(lerp(-140,168,k1),lerp(1560,1228,k1),96,10,INK,clamp(bt/.1));
        o+=rrect(lerp(-140,268,k2),lerp(1560,1128,k2),96,29,INK,clamp((bt-.12)/.1));
      }
      sub='';
      o+=text('EL MÉTODO INTERFORMA',540,1312,{size:30,font:'JBM',weight:400,fill:E800,op:eyebrowOp,ls:6});
    }
    o+=puntoAt(PC[0],PC[1],PR,st);
    o+=text(cap,540,1420,{size:t<8?96:110,op:capOp,dy:16*(1-capOp)});
    if(sub) o+=text(sub,540,1500,{size:42,font:'Manrope',weight:500,fill:MUTED,op:subOp});
  }
  else {
    // 4 · Cierra los ojos y vuelve a ser el logo; 5 · firma
    const k=eio(prog(t,11.6,12.8));
    const cx=lerp(PC[0],C[0],k), cy=lerp(PC[1],C[1],k), r=lerp(PR,75,k);
    const ka=eout(prog(t,12.0,12.9)), kb=eout(prog(t,11.9,12.8));
    o+=rrect(lerp(A[0]-560,A[0],ka),lerp(A[1]+560,A[1],ka),M,15,INK);
    o+=rrect(lerp(B[0]-560,B[0],kb),lerp(B[1]+560,B[1],kb),M,45,INK);
    const w=wobble(t-12.85,.07,2,6);
    o+=`<g transform="translate(${cx} ${cy+75*w}) scale(${1+w} ${1-w}) translate(${-cx} ${-cy})">`+
       puntoAt(cx,cy,r,{eyes:'happy',eyeAlpha:1-prog(t,11.6,11.95)})+`</g>`;
    const a=eout(prog(t,13.0,13.5)), b=eout(prog(t,13.3,13.8)), c=eout(prog(t,13.6,14.1));
    o+=text('interforma',540,1290,{size:132,op:a,dy:24*(1-a),ls:-4});
    o+=text('Transformación digital con método.',540,1375,{size:42,font:'Manrope',weight:500,fill:MUTED,op:b,dy:16*(1-b)});
    o+=text('interforma.digital',540,1500,{size:34,font:'JBM',weight:400,fill:E800,op:c,ls:1});
  }
  svg.innerHTML=o;
};
/* =====================================================================
   "La semilla" — historia de ~50 s (1080×1920)
   Una semilla bajo tierra echa raíces, brota al amanecer, crece con cinco
   hojas (las cinco capacidades), florece en el círculo naranja, nace Punto
   y la planta se condensa en el isotipo.
   ===================================================================== */
const GROUND=1560, SEED=[540,1650], TIP=[540,650], FR=128;
const STEM_D='M540 1560 C 610 1330, 470 1010, 540 640';
// v2 · raíces procedurales: se ramifican, se adelgazan y crecen con la planta
function _rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const ROOT_SEGS=(()=>{const R=_rng(20261020),segs=[];const D=Math.PI/180;
  const DUR=[4.6,4.2,3.8,3.2], KIDS=[3,2,1,0], NPT=18;
  function grow(x,y,ang,len,depth,t0,w0,parent){
    const pts=[[x,y]];let a=ang,cx=x,cy=y;const st=len/NPT;const bend=(R()-.5)*1.4*D;
    for(let i=1;i<=NPT;i++){
      a+=bend+(R()-.5)*5*D;
      if(cy<GROUND+26) a+= (Math.sin(a)<.5? (Math.cos(a)>0?1:-1)*6*D:0); // no salir a la superficie
      if(cy>1835) a+=(Math.cos(a)>0?-1:1)*3*D;                        // se aplana al fondo
      if(cy>1900) break;
      if(cx<90&&Math.cos(a)<0||cx>990&&Math.cos(a)>0) a=Math.PI-a;
      cx+=Math.cos(a)*st;cy+=Math.sin(a)*st;pts.push([cx,cy]);}
    const w1=depth>=3?.7:w0*.42;
    const seg={pts,w0,w1,t0,dur:DUR[depth]*(.85+R()*.3),depth};segs.push(seg);
    const n=pts.length>5?KIDS[depth]:0;
    for(let k=0;k<n;k++){
      const f=.28+(k+R()*.8)/n*.6, i=Math.min(pts.length-2,Math.round(f*(pts.length-1)));
      const [px,py]=pts[i],[qx,qy]=pts[i+1];const la=Math.atan2(qy-py,qx-px);
      const side=(k%2?1:-1)*(R()<.5?1:-1);
      grow(px,py,la+side*(24+R()*30)*D,len*(.55+R()*.2),depth+1,seg.t0+f*seg.dur*.9,lerp(w0,w1,f)*.78,seg);}
  }
  // raíz pivotante + laterales principales
  [[92,250,6.0,9],[124,195,6.25,7.5],[58,200,6.5,7.5],[152,160,7.3,6],[28,160,7.6,6]]
    .forEach(([deg,len,t0,w])=>grow(SEED[0],SEED[1]+6,deg*D,len,0,t0,w,null));
  return segs;})();
function rootShape(seg,k,op){ // polígono que se adelgaza hacia la punta
  const n=seg.pts.length-1, e=k*n, m=Math.floor(e), fr=e-m; if(e<.05) return '';
  const P=seg.pts.slice(0,m+1); if(m<n){const [ax,ay]=seg.pts[m],[bx,by]=seg.pts[m+1];P.push([lerp(ax,bx,fr),lerp(ay,by,fr)]);}
  const L=[],Rr=[];
  P.forEach((p,i)=>{const q=P[Math.min(i+1,P.length-1)],r=P[Math.max(i-1,0)];let dx=q[0]-r[0],dy=q[1]-r[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const u=i/(P.length-1), wf=lerp(seg.w0,seg.w1,(i/n)) * (u>.8? lerp(1,.35,(u-.8)/.2):1) /2;
    L.push(`${(p[0]-dy*wf).toFixed(1)},${(p[1]+dx*wf).toFixed(1)}`);Rr.push(`${(p[0]+dy*wf).toFixed(1)},${(p[1]-dx*wf).toFixed(1)}`);});
  return `<polygon points="${L.concat(Rr.reverse()).join(' ')}" fill="#BEB8AE" opacity="${op}"/>`;}
function rootPoint(seg,f){const n=seg.pts.length-1,e=clamp(f,0,1)*n,m=Math.min(n-1,Math.floor(e)),fr=e-m;const [ax,ay]=seg.pts[m],[bx,by]=seg.pts[m+1];return [lerp(ax,bx,fr),lerp(ay,by,fr)];}
const LEAVES=[
  {f:.16,side:1, label:'Estrategia', t:18.5},
  {f:.30,side:-1,label:'Procesos', t:20.5},
  {f:.44,side:1, label:'Tecnología', t:22.5},
  {f:.58,side:-1,label:'Automatización', t:24.5},
  {f:.71,side:1, label:'Inteligencia artificial', t:26.5},
];
// crecimiento del tallo: [tiempo, fracción]
const STEM_K=[[12.0,0],[16.0,.11],[18.5,.16],[20.5,.30],[22.5,.44],[24.5,.58],[26.5,.71],[28.2,1]];
let _stem=null,_len=0;
function stemGeo(){if(!_stem){_stem=document.createElementNS('http://www.w3.org/2000/svg','path');_stem.setAttribute('d',STEM_D);const g=document.createElementNS('http://www.w3.org/2000/svg','svg');g.style.position='absolute';g.style.left='-9999px';g.appendChild(_stem);document.body.appendChild(g);_len=_stem.getTotalLength();}return _stem;}
const ptAt=f=>{const p=stemGeo().getPointAtLength(_len*f);return [p.x,p.y];};
function stemProg(t){if(t<=STEM_K[0][0])return 0;for(let i=1;i<STEM_K.length;i++){const [t1,f1]=STEM_K[i],[t0,f0]=STEM_K[i-1];if(t<=t1)return lerp(f0,f1,(t-t0)/(t1-t0));}return 1;}
const pathLen=d=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);return p.getTotalLength();};
function textL(str,x,y,anchor,{size=28,fill=INK,op=1}={}){if(op<=0)return '';return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="JBM" font-size="${size}" letter-spacing="1" fill="${fill}" opacity="${op}">${str}</text>`;}

window.story=(t)=>{
  stemGeo();
  const svg=document.getElementById('stage');
  svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);

  const dawn=eio(prog(t,13.0,17.0));             // noche → día
  const reveal=eio(prog(t,39.8,40.7));           // la tierra desaparece
  const sky=mix(INK,BG,dawn);
  const txtCol=mix(PAPEL,INK,dawn);
  let o=`<rect width="${W}" height="${H}" fill="${sky}"/>`;

  // cámara: de cerca a la semilla → plano general
  const cz=eio(prog(t,12.0,16.5));
  const s=lerp(2.2,1,cz), fx=lerp(SEED[0],540,cz), fy=lerp(SEED[1],960,cz), sx=540, sy=lerp(1150,960,cz);
  let w=`<g transform="translate(${sx} ${sy}) scale(${s}) translate(${-fx} ${-fy})">`;

  // tierra
  const soilOp=1-reveal;
  if(soilOp>0){
    w+=`<rect x="-2000" y="${GROUND}" width="5000" height="3000" fill="${INK}" opacity="${soilOp}"/>`;
    w+=`<line x1="-2000" y1="${GROUND}" x2="5000" y2="${GROUND}" stroke="${'#BEB8AE'}" stroke-width="${2/s*1.4}" opacity="${soilOp}"/>`;
    // raíces
    ROOT_SEGS.forEach(seg=>{const k=eout(prog(t,seg.t0,seg.t0+seg.dur));if(k<=0)return;w+=rootShape(seg,k,soilOp);
      if(seg.depth===3&&k>=1){const [x,y]=seg.pts[seg.pts.length-1],hk=eout(prog(t,seg.t0+seg.dur,seg.t0+seg.dur+1.2));
